<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payton Ming-Li Wright</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
/* ===========================================================
   Payton Ming-Li Wright — Portfolio
   Quiet, editorial, minimal. Modeled after nikkiheatonstudio.com
=========================================================== */

:root{
  --stone:#F6F4EF;
  --ink:#1a1a1a;
  --mute:#6f6a62;
  --line: rgba(26,26,26,0.12);
  --max: 1240px;
}

*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  background:var(--stone);
  color:var(--ink);
  font-family:'Jost', sans-serif;
  font-weight:300;
  font-size:16px;
  line-height:1.6;
  -webkit-font-smoothing:antialiased;
}
@media (prefers-reduced-motion: reduce){
  html{scroll-behavior:auto;}
  *{animation-duration:.01ms !important; transition-duration:.01ms !important;}
}
a{color:inherit; text-decoration:none;}
img{max-width:100%; display:block; width:100%; height:100%; object-fit:cover;}
.wrap{max-width:var(--max); margin:0 auto; padding:0 40px;}

.serif{font-family:'Cormorant Garamond', serif; font-weight:400;}

/* ---------- header / nav ---------- */
.site-header{
  position:sticky; top:0; z-index:40;
  background:rgba(246,244,239,0.9);
  backdrop-filter:blur(6px);
}
.site-header .bar{
  display:flex; align-items:center; justify-content:space-between;
  padding:26px 40px;
  max-width:var(--max); margin:0 auto;
}
.wordmark{
  font-family:'Cormorant Garamond', serif;
  font-size:18px;
  font-weight:600;
  letter-spacing:0.09em;
  text-transform:uppercase;
}
nav.primary{display:flex; gap:34px;}
nav.primary a{
  font-size:11px;
  letter-spacing:0.18em;
  text-transform:uppercase;
  padding-bottom:4px;
  border-bottom:1px solid transparent;
  transition:border-color .2s ease, color .2s ease;
}
nav.primary a:hover, nav.primary a.active{
  border-color:var(--ink);
}
.nav-toggle{
  display:none; background:none; border:none; cursor:pointer;
  font-size:11px; letter-spacing:0.18em; text-transform:uppercase;
}

/* ---------- full-page hero (home) ---------- */
.hero-full{
  height:100vh; width:100%; position:relative; overflow:hidden;
}
.hero-full img{width:100%; height:100%; object-fit:cover;}
.hero-full .scroll-cue{
  position:absolute; left:50%; bottom:34px; transform:translateX(-50%);
  width:22px; height:34px;
  border:1.5px solid rgba(255,255,255,0.85); border-radius:12px;
  display:flex; justify-content:center; padding-top:6px;
}
.hero-full .scroll-cue::after{
  content:''; width:4px; height:4px; border-radius:50%;
  background:rgba(255,255,255,0.9);
  animation:scrollcue 1.6s ease infinite;
}
@keyframes scrollcue{
  0%{ transform:translateY(0); opacity:1; }
  70%{ transform:translateY(10px); opacity:0; }
  100%{ transform:translateY(10px); opacity:0; }
}

/* ---------- hero image (inner pages) ---------- */
.hero-image{
  height:46vh; width:100%; position:relative; overflow:hidden;
}
.hero-image .overlay{
  position:absolute; inset:0;
  background:linear-gradient(180deg, rgba(0,0,0,0.05), rgba(0,0,0,0.28));
}
.hero-image .caption{
  position:absolute; left:40px; bottom:40px; color:#fff;
  max-width:520px;
}
.hero-image .caption h1{
  font-family:'Cormorant Garamond', serif; font-weight:400;
  font-size:clamp(32px,5vw,54px); margin:0;
}

/* ---------- two-way split entry (home) ---------- */
.entry-grid{
  display:grid; grid-template-columns:1fr 1fr;
}
@media (max-width:800px){ .entry-grid{grid-template-columns:1fr;} }
.entry-tile{
  position:relative; height:64vh; overflow:hidden;
}
.entry-tile .overlay{
  position:absolute; inset:0;
  background:rgba(0,0,0,0.18);
  transition:background .3s ease;
  display:flex; align-items:center; justify-content:center;
}
.entry-tile:hover .overlay{background:rgba(0,0,0,0.32);}
.entry-tile h2{
  color:#fff; font-family:'Cormorant Garamond', serif; font-weight:400;
  font-size:clamp(26px,3.4vw,42px); letter-spacing:0.02em;
}

/* ---------- section ---------- */
.section{padding:88px 0;}
.section-head{text-align:center; margin-bottom:56px;}
.section-head h2{
  font-family:'Cormorant Garamond', serif; font-weight:400;
  font-size:clamp(28px,4vw,42px); margin:0;
}

/* ---------- sidebar + project list layout ---------- */
.page-layout{
  display:grid;
  grid-template-columns: 200px 1fr;
  gap:56px;
  align-items:start;
}
.project-nav{
  position:sticky;
  top:120px;
  display:flex;
  flex-direction:column;
  gap:16px;
  padding-right:8px;
}
.project-nav a{
  font-size:13px;
  color:var(--mute);
  line-height:1.4;
  transition:color .2s ease;
}
.project-nav a:hover{color:var(--ink);}
.project-nav a.active{
  color:var(--ink);
  font-weight:600;
}
@media (max-width:900px){
  .page-layout{grid-template-columns:1fr;}
  .project-nav{
    position:static;
    flex-direction:row;
    flex-wrap:wrap;
    gap:10px 20px;
    padding:0 0 32px;
    border-bottom:1px solid var(--line);
    margin-bottom:16px;
  }
}

/* ---------- work / project item ---------- */
.work-item{
  display:grid; grid-template-columns: 1fr 1.4fr; gap:48px; align-items:center;
  padding:56px 0; border-top:1px solid var(--line);
  scroll-margin-top:110px;
}
.project-list .work-item:first-child{border-top:none;}
.project-list .work-item:last-child{padding-bottom:0;}
@media (max-width:800px){ .work-item{grid-template-columns:1fr; gap:24px;} }
.work-item .frame{aspect-ratio:16/11; overflow:hidden; background:#e9e5dc;}
.work-item .copy p.eyebrow{
  font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--mute); margin:0 0 10px;
}
.work-item .copy h3{
  font-family:'Cormorant Garamond', serif; font-weight:400; font-size:clamp(22px,3vw,30px); margin:0 0 14px;
}
.work-item .copy p.desc{max-width:440px; color:#3a3733; margin:0;}

/* ---------- contact ---------- */
.contact-block{text-align:center; padding:40px 0;}
.contact-block .line{
  font-family:'Cormorant Garamond', serif;
  font-size:clamp(22px,3vw,30px);
  margin:18px 0;
}
.contact-block .line a:hover{text-decoration:underline;}
.contact-block p.eyebrow{
  font-size:11px; letter-spacing:0.2em; text-transform:uppercase; color:var(--mute); margin:36px 0 0;
}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line); padding:64px 0 40px; text-align:center;}
footer .wordmark{display:block; margin-bottom:16px;}
.footer-links{display:flex; gap:22px; justify-content:center; margin:18px 0; font-size:11px; letter-spacing:0.14em; text-transform:uppercase;}

/* ---------- reveal ---------- */
.reveal{opacity:0; transform:translateY(16px); transition:opacity .8s ease, transform .8s ease;}
.reveal.in{opacity:1; transform:translateY(0);}

/* ---------- mobile nav ---------- */
@media (max-width:780px){
  nav.primary{
    position:fixed; inset:76px 0 0 0; background:var(--stone);
    flex-direction:column; align-items:flex-start; gap:0; padding:10px 40px;
    transform:translateY(-8px); opacity:0; pointer-events:none;
    transition:opacity .2s ease, transform .2s ease;
  }
  nav.primary.open{opacity:1; pointer-events:auto; transform:translateY(0);}
  nav.primary a{width:100%; padding:18px 0; border-bottom:1px solid var(--line);}
  .nav-toggle{display:block;}
}

</style>
</head>

<script>
document.addEventListener('DOMContentLoaded', function(){
  // mobile nav toggle
  var toggle = document.querySelector('.nav-toggle');
  var nav = document.querySelector('nav.primary');
  if(toggle && nav){
    toggle.addEventListener('click', function(){
      var open = nav.classList.toggle('open');
      toggle.textContent = open ? 'Close' : 'Menu';
    });
    nav.querySelectorAll('a').forEach(function(a){
      a.addEventListener('click', function(){
        nav.classList.remove('open');
        toggle.textContent = 'Menu';
      });
    });
  }

  // scroll reveal
  var revealEls = document.querySelectorAll('.reveal');
  if('IntersectionObserver' in window && revealEls.length){
    var io = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('in');
          io.unobserve(entry.target);
        }
      });
    }, {threshold:0.12});
    revealEls.forEach(function(el){ io.observe(el); });
  } else {
    revealEls.forEach(function(el){ el.classList.add('in'); });
  }

  // sidebar scrollspy: bold the project link matching the section in view
  var navLinks = document.querySelectorAll('.project-nav a');
  var items = document.querySelectorAll('.project-list .work-item');
  if(navLinks.length && items.length && 'IntersectionObserver' in window){
    var linkMap = {};
    navLinks.forEach(function(a){
      linkMap[a.getAttribute('href').replace('#','')] = a;
    });
    var spy = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        var link = linkMap[entry.target.id];
        if(!link) return;
        if(entry.isIntersecting){
          navLinks.forEach(function(a){ a.classList.remove('active'); });
          link.classList.add('active');
        }
      });
    }, {threshold:0.4, rootMargin:'-110px 0px -40% 0px'});
    items.forEach(function(el){ spy.observe(el); });
  }
});

</script>
